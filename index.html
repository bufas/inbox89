<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>inbox89</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @keyframes drift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes spin-in {
      0%   { transform: rotateX(90deg) scale(0.6); opacity: 0; }
      60%  { transform: rotateX(-12deg) scale(1.05); opacity: 1; }
      100% { transform: rotateX(0deg) scale(1); opacity: 1; }
    }
    body {
      background: linear-gradient(-45deg, #0d0d0d, #1a1025, #0d1a1a, #110d1a);
      background-size: 400% 400%;
      animation: drift 20s ease infinite;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    #rebus {
      display: flex;
      flex-direction: column;
      gap: 2vmin;
      align-items: center;
    }
    .e {
      font-size: min(14vmin, 96px);
      line-height: 1;
      display: inline-block;
    }
    .e.animate {
      animation: spin-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
  </style>
</head>

  <div id="rebus">
