    @keyframes fade-in {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes glitch-jitter {
      0%   { transform: translate(0,0)       skewX(0deg)   scaleX(1);    opacity: 1; }
      8%   { transform: translate(-8px, 3px)  skewX(10deg)  scaleX(1.04); opacity: 0.8; }
      16%  { transform: translate(9px,-4px)   skewX(-8deg)  scaleX(0.96); opacity: 1; }
      24%  { transform: translate(-5px, 6px)  skewX(7deg)   scaleX(1.05); opacity: 0.75; }
      32%  { transform: translate(11px, 1px)  skewX(-11deg) scaleX(0.95); opacity: 1; }
      40%  { transform: translate(-3px,-8px)  skewX(9deg)   scaleX(1.03); opacity: 0.85; }
      48%  { transform: translate(8px, 4px)   skewX(-6deg)  scaleX(0.97); opacity: 0.6; }
      56%  { transform: translate(-10px,-2px) skewX(12deg)  scaleX(1.04); opacity: 1; }
      64%  { transform: translate(6px, 7px)   skewX(-9deg)  scaleX(0.96); opacity: 0.8; }
      72%  { transform: translate(-4px,-5px)  skewX(8deg)   scaleX(1.03); opacity: 1; }
      80%  { transform: translate(10px, 2px)  skewX(-10deg) scaleX(0.97); opacity: 0.7; }
      90%  { transform: translate(-7px, 1px)  skewX(11deg)  scaleX(1.02); opacity: 1; }
      100% { transform: translate(0,0)       skewX(0deg)   scaleX(1);    opacity: 1; }
    }
    html {
      background: #111;
    }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2vmin;
user-select: none;
    }
    span {
      font-size: min(14vmin, 96px);
      line-height: 1;
      display: inline-block;
    }
    span.animate {
      animation: fade-in 5s ease-in both;
    }
    span.glitching {
      animation: glitch-jitter 0.08s steps(1) infinite;
    }
  </style>

    ];

    const TARGET = ["📥", "8️⃣", "9️⃣"];
    const slots = [...document.querySelectorAll("span")];

    function pickRandom(exclude) {
      let e;
      do { e = emojis[Math.floor(Math.random() * emojis.length)]; } while (e === exclude);
      return e;
    }

    function startGlitch() {
      const STAGGER = 150; // ms between each slot settling
      const END_MS = slots.map((_, i) => 600 + i * STAGGER);
      const SETTLE_MS = 200;
      const TICK = 40;
      let elapsed = 0;
      const settled = slots.map(() => false);

      slots.forEach(slot => {
        slot.style.animationDelay = "";
        slot.classList.remove("animate");
        slot.classList.add("glitching");
      });

      const timer = setInterval(() => {
        elapsed += TICK;
        slots.forEach((slot, i) => {
          if (settled[i]) return;
          const settleProgress = (elapsed - (END_MS[i] - SETTLE_MS)) / SETTLE_MS;
          if (settleProgress > 0 && Math.random() < settleProgress) {
            slot.textContent = TARGET[i];
          } else {
            slot.textContent = pickRandom(TARGET[i]);
          }
          if (elapsed >= END_MS[i]) {
            settled[i] = true;
            slot.classList.remove("glitching");
            slot.textContent = TARGET[i];
          }
        });

        if (settled.every(Boolean)) {
          clearInterval(timer);
        }
      }, TICK);
    }

    slots.forEach((slot, i) => {
      slot.textContent = pickRandom(TARGET[i]);
      slot.style.animationDelay = (i * 1400) + "ms";
      slot.classList.add("animate");
    });
    setTimeout(startGlitch, 5000);
